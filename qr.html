<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Guest QR Codes | Ahmad &amp; Toyibat</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230d4b3a'/%3E%3Ccircle cx='32' cy='32' r='20' fill='none' stroke='%23d7b66c' stroke-width='2'/%3E%3Cpath d='M22 32h20M32 22v20' stroke='%23d7b66c' stroke-width='2'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <style>
    :root {
      --emerald: #0d4b3a;
      --emerald-dark: #07372b;
      --emerald-soft: #1c6651;
      --gold: #d7b66c;
      --gold-light: #f1dfad;
      --ivory: #fffdf8;
      --cream: #f8f5ed;
      --ink: #21332d;
      --muted: #68766e;
      --line: rgba(13,75,58,.16);
      --line-gold: rgba(215,182,108,.28);
      --serif: "Cormorant Garamond", Georgia, serif;
      --sans: "Montserrat", Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    a, button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

    body {
      min-height: 100vh;
      background: var(--cream);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 56px 24px 72px;
      font-family: var(--sans);
      color: var(--ink);
    }

    /* ── Header ────────────────────────────────────────────── */
    .header {
      text-align: center;
      margin-bottom: 52px;
    }

    /* Monogram ring — mirrors the hero monogram */
    .monogram {
      display: inline-flex;
      align-items: center; justify-content: center;
      width: 64px; height: 64px;
      border: 1px solid rgba(215,182,108,.5);
      border-radius: 50%;
      margin-bottom: 24px;
      color: var(--gold);
      font: 500 1.35rem/1 var(--serif);
      letter-spacing: .03em;
      position: relative;
    }
    .monogram::before {
      content: ""; position: absolute;
      inset: -6px; border-radius: 50%;
      border: 1px solid rgba(215,182,108,.18);
    }

    .header h1 {
      font: 500 2.8rem/1.1 var(--serif);
      color: var(--emerald);
      letter-spacing: .02em;
      margin-bottom: 10px;
    }

    .header p {
      font: 400 .68rem/1.6 var(--sans);
      color: var(--muted);
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }

    /* ── Card ─────────────────────────────────────────────── */
    .card {
      background: var(--ivory);
      padding: 44px 40px;
      width: 100%;
      max-width: 500px;
      /* Matches invitation card: outer gold border + inner inset */
      border: 1px solid rgba(215,182,108,.4);
      position: relative;
      box-shadow: 0 32px 80px rgba(7,55,43,.35), 0 2px 8px rgba(7,55,43,.18);
      color: var(--ink);
    }
    /* Inner frame rule */
    .card::before {
      content: ""; position: absolute; inset: 12px;
      border: 1px solid rgba(215,182,108,.16);
      pointer-events: none;
    }

    .card > label,
    .batch-section > label {
      display: block;
      font: 600 .6rem/1 var(--sans);
      letter-spacing: 2.2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 34px;
    }

    .card input[type="text"] {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid var(--line-gold);
      border-radius: 0;
      background: var(--cream);
      font: 500 .95rem/1 var(--sans);
      color: var(--ink);
      outline: none;
      transition: border-color .2s;
    }
    .card input[type="text"]:focus { border-color: var(--gold); }
    .card input[type="text"]::placeholder { color: #aab5b0; }

    .btn-generate {
      padding: 12px 20px;
      background: var(--emerald);
      color: var(--gold-light);
      border: none;
      border-radius: 0;
      font: 600 .65rem/1 var(--sans);
      letter-spacing: 1.8px;
      text-transform: uppercase;
      cursor: pointer;
      white-space: nowrap;
      transition: background .2s;
    }
    .btn-generate:hover { background: var(--emerald-soft); }

    /* ── QR output ────────────────────────────────────────── */
    .qr-output {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }
    .qr-output.visible { display: flex; }
    .qr-error {
      display: none;
      margin-top: 12px;
      color: #a34d3f;
      font-size: .72rem;
      line-height: 1.5;
      text-align: center;
    }
    .qr-error.visible { display: block; }

    .qr-frame {
      position: relative;
      background: white;
      padding: 20px;
      border: 1px solid var(--line-gold);
    }
    /* Corner gold accents */
    .qr-frame::before, .qr-frame::after {
      content: ""; position: absolute;
      width: 18px; height: 18px;
      border-color: var(--gold); border-style: solid;
    }
    .qr-frame::before { top: 7px; left: 7px; border-width: 1.5px 0 0 1.5px; }
    .qr-frame::after  { bottom: 7px; right: 7px; border-width: 0 1.5px 1.5px 0; }

    #qr-canvas { display: block; }

    .qr-caption { text-align: center; }
    .qr-caption .guest-name {
      font: 600 1.25rem/1 var(--serif);
      color: var(--emerald);
      margin-bottom: 5px;
    }
    .qr-caption .qr-url {
      font: 400 .68rem/1.5 var(--sans);
      color: var(--muted);
      word-break: break-all;
    }
    .qr-caption a.qr-url {
      display: inline-block;
      margin-top: 5px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--gold-light);
      text-decoration: none;
      font: 600 1.1rem/1 var(--serif);
      letter-spacing: 2.5px;
      text-transform: uppercase;
      transition: color .2s, text-shadow .2s;
    }
    .qr-caption a.qr-url:hover {
      background: transparent;
      color: #fff4c9;
      text-decoration: none;
      text-shadow: 0 0 14px rgba(215,182,108,.55);
    }
    .qr-caption .qr-brand {
      margin-bottom: 5px;
      color: var(--gold);
      font: 600 .62rem/1 var(--sans);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* ── Action buttons ───────────────────────────────────── */
    .actions {
      display: flex;
      gap: 10px;
      width: 100%;
    }
    .btn-action {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      gap: 8px;
      padding: 13px 14px;
      border-radius: 0;
      font: 600 .65rem/1 var(--sans);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer; border: none;
      transition: background .2s;
    }
    .btn-download { background: var(--emerald); color: var(--gold-light); }
    .btn-download:hover { background: var(--emerald-soft); }
    .btn-print { background: var(--cream); color: var(--emerald); border: 1px solid var(--line-gold); }
    .btn-print:hover { background: #ece8d9; }

    /* ── Divider ──────────────────────────────────────────── */
    .divider {
      display: flex; align-items: center; gap: 14px;
      margin: 32px 0 24px;
    }
    .divider::before, .divider::after {
      content: ""; flex: 1; height: 1px;
      background: var(--line-gold);
    }
    .divider span {
      font: 400 .6rem/1 var(--sans);
      letter-spacing: 1.8px; text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Batch section ────────────────────────────────────── */
    .batch-section textarea {
      width: 100%;
      min-height: 88px;
      padding: 12px 14px;
      border: 1px solid var(--line-gold);
      border-radius: 0;
      background: var(--cream);
      font: 400 .88rem/1.6 var(--sans);
      color: var(--ink);
      resize: vertical; outline: none;
      transition: border-color .2s;
      margin-bottom: 12px;
    }
    .batch-section textarea:focus { border-color: var(--gold); }
    .batch-section textarea::placeholder { color: #aab5b0; }

    .btn-batch {
      width: 100%; padding: 13px;
      background: var(--cream); color: var(--emerald);
      border: 1px solid var(--line-gold); border-radius: 0;
      font: 600 .65rem/1 var(--sans);
      letter-spacing: 1.8px; text-transform: uppercase;
      cursor: pointer; transition: background .2s;
    }
    .btn-batch:hover { background: #ece8d9; }
    .btn-whatsapp-batch {
      width: 100%; padding: 13px;
      margin-top: 9px;
      background: var(--emerald); color: var(--gold-light);
      border: 1px solid rgba(215,182,108,.45); border-radius: 0;
      font: 600 .65rem/1 var(--sans);
      letter-spacing: 1.8px; text-transform: uppercase;
      cursor: pointer; transition: background .2s;
    }
    .btn-whatsapp-batch:hover { background: var(--emerald-soft); }
    .batch-links {
      display: none;
      width: 100%;
      margin-top: 22px;
      border-top: 1px solid var(--line-gold);
      padding-top: 16px;
    }
    .batch-links.visible { display: block; }
    .batch-link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(215,182,108,.14);
    }
    .batch-link-name {
      min-width: 0;
      color: var(--emerald);
      font: 500 1.05rem var(--serif);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .batch-link-send {
      flex: 0 0 auto;
      padding: 8px 10px;
      border: 0;
      background: var(--gold);
      color: var(--emerald-dark);
      font: 600 .57rem/1 var(--sans);
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
    }
    .batch-link-send:hover { background: var(--gold-light); }

    /* ── Footer ───────────────────────────────────────────── */
    .footer {
      margin-top: 42px; text-align: center;
      font: 400 .65rem/1.6 var(--sans);
      color: var(--muted);
      letter-spacing: 1.5px; text-transform: uppercase;
    }
    .footer a { color: var(--emerald); text-decoration: none; }
    .footer a:hover { color: var(--emerald-soft); }

    /* ── Print styles ─────────────────────────────────────── */
    @media print {
      body { background: white; padding: 0; }
      .header, .card > *:not(.qr-output), .btn-action,
      .footer, .batch-section, .divider, .actions { display: none !important; }
      .qr-output { display: flex !important; align-items: center; }
      .qr-frame { box-shadow: none; border: 1px solid #ddd; }
    }

    @media (max-width: 540px) {
      body { padding: 40px 16px 60px; }
      .card { padding: 32px 20px; }
      .header h1 { font-size: 2.2rem; }
      .actions { flex-direction: column; }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="monogram">T&amp;A</div>
    <h1>Guest QR Codes</h1>
    <p>Ahmad &amp; Toyibat &nbsp;·&nbsp; Wedding Invitation</p>
  </div>

  <div class="card">

    <!-- Single guest -->
    <label for="guest-input">Guest name</label>
    <div class="input-row">
      <input
        type="text"
        id="guest-input"
        placeholder="e.g. Uncle Rasheed"
        autocomplete="off"
        spellcheck="false"
      />
      <button class="btn-generate" onclick="generateQR()">Generate</button>
    </div>

    <!-- QR output -->
    <div class="qr-output" id="qr-output">
      <div class="qr-frame">
        <canvas id="qr-canvas"></canvas>
      </div>
      <div class="qr-caption">
        <div class="guest-name" id="qr-guest-label"></div>
          <div class="qr-brand">T&amp;A 2026 · Personalised Invitation</div>
          <a class="qr-url" id="qr-url-label" href="/" target="_blank" rel="noopener">T&amp;A 2026</a>
      </div>
      <div class="actions">
        <button class="btn-action btn-download" onclick="downloadQR()">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M8 1v9M4.5 6.5 8 10l3.5-3.5M2 12h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Download
        </button>
        <button class="btn-action btn-print" onclick="window.print()">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <rect x="3" y="1" width="10" height="7" rx="1" stroke="currentColor" stroke-width="1.6"/>
            <rect x="3" y="9" width="10" height="6" rx="1" stroke="currentColor" stroke-width="1.6"/>
            <path d="M5 12h6M5 14h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <rect x="1" y="6" width="14" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/>
          </svg>
          Print
        </button>
      </div>
    </div>
    <p class="qr-error" id="qr-error" role="alert"></p>

    <!-- Batch section -->
    <div class="batch-section">
      <div class="divider"><span>or generate multiple</span></div>
      <label for="batch-input">Guest list (one name per line)</label>
      <textarea
        id="batch-input"
        placeholder="Aunty Fatima&#10;Uncle Rasheed&#10;Cousin Maryam"
      ></textarea>
      <button class="btn-whatsapp-batch" onclick="prepareWhatsAppBatch()">Prepare WhatsApp links</button>
      <button class="btn-batch" onclick="downloadBatch()">Download all as ZIP</button>
      <div class="batch-links" id="batch-links" aria-live="polite"></div>
    </div>

  </div>

  <div class="footer">
    <a href="/">← Back to invitation</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script>
    const BASE_URL = window.location.origin + '/';
    function sanitizeGuestName(value) {
      return String(value || '')
        .normalize('NFKC')
        .replace(/[\u0000-\u001F\u007F-\u009F]/g, '')
        .replace(/[<>]/g, '')
        .replace(/\s+/g, ' ')
        .trim()
        .slice(0, 120);
    }
    const presetName = sanitizeGuestName(new URLSearchParams(window.location.search).get('name'));

    function buildUrl(name) {
      return BASE_URL + '?to=' + encodeURIComponent(sanitizeGuestName(name));
    }

    function openWhatsAppForGuest(name) {
      const url = buildUrl(name);
      const message = `T&A 2026\n${url}`;
      window.open(`https://wa.me/?text=${encodeURIComponent(message)}`, '_blank', 'noopener');
    }

    function prepareWhatsAppBatch() {
      const raw = document.getElementById('batch-input').value;
      const names = raw.split('\n').map(sanitizeGuestName).filter(Boolean).slice(0, 200);
      const output = document.getElementById('batch-links');
      if (names.length === 0) {
        document.getElementById('batch-input').focus();
        output.classList.remove('visible');
        return;
      }
      output.innerHTML = '';
      names.forEach(name => {
        const item = document.createElement('div');
        item.className = 'batch-link-item';
        const label = document.createElement('span');
        label.className = 'batch-link-name';
        label.textContent = name;
        const button = document.createElement('button');
        button.className = 'batch-link-send';
        button.type = 'button';
        button.textContent = 'Send';
        button.addEventListener('click', () => openWhatsAppForGuest(name));
        item.append(label, button);
        output.appendChild(item);
      });
      output.classList.add('visible');
    }

    async function renderQRToCanvas(canvas, url) {
      if (!window.QRCode || typeof QRCode.toCanvas !== 'function') {
        throw new Error('QR generator is unavailable');
      }
      await QRCode.toCanvas(canvas, url, {
        width: 240,
        margin: 2,
        color: { dark: '#0d4b3a', light: '#ffffff' },
        errorCorrectionLevel: 'H'
      });
      // Add a compact T&A 2026 mark in the centre. High error correction keeps
      // the personalised QR readable after the mark is placed over the code.
      const ctx = canvas.getContext('2d');
      const markWidth = 72;
      const markHeight = 34;
      const x = (canvas.width - markWidth) / 2;
      const y = (canvas.height - markHeight) / 2;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      const radius = Math.min(7, markWidth / 2, markHeight / 2);
      if (typeof ctx.roundRect === 'function') {
        ctx.roundRect(x, y, markWidth, markHeight, radius);
      } else {
        // Safari/WebView versions without CanvasRenderingContext2D.roundRect.
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + markWidth - radius, y);
        ctx.arcTo(x + markWidth, y, x + markWidth, y + radius, radius);
        ctx.lineTo(x + markWidth, y + markHeight - radius);
        ctx.arcTo(x + markWidth, y + markHeight, x + markWidth - radius, y + markHeight, radius);
        ctx.lineTo(x + radius, y + markHeight);
        ctx.arcTo(x, y + markHeight, x, y + markHeight - radius, radius);
        ctx.lineTo(x, y + radius);
        ctx.arcTo(x, y, x + radius, y, radius);
        ctx.closePath();
      }
      ctx.fill();
      ctx.strokeStyle = '#d7b66c';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = '#0d4b3a';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '600 13px Georgia, serif';
      ctx.fillText('T&A', canvas.width / 2, y + 13);
      ctx.fillStyle = '#8b6b2d';
      ctx.font = '600 7px Montserrat, Arial, sans-serif';
      ctx.letterSpacing = '1px';
      ctx.fillText('2026', canvas.width / 2, y + 25);
    }

    async function generateQR() {
      const name = sanitizeGuestName(document.getElementById('guest-input').value);
      if (!name) { document.getElementById('guest-input').focus(); return; }
      document.getElementById('guest-input').value = name;
      const error = document.getElementById('qr-error');
      error.classList.remove('visible');
      try {
        const url = buildUrl(name);
        const canvas = document.getElementById('qr-canvas');
        await renderQRToCanvas(canvas, url);
        document.getElementById('qr-guest-label').textContent = name;
        const urlLabel = document.getElementById('qr-url-label');
        urlLabel.textContent = 'T&A 2026';
        urlLabel.href = url;
        document.getElementById('qr-output').classList.add('visible');
        fetch('/api/qr-created', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        }).catch(() => {});
      } catch (err) {
        error.textContent = 'The QR generator could not load. Please refresh and try again.';
        error.classList.add('visible');
      }
    }

    function downloadQR() {
      const name = sanitizeGuestName(document.getElementById('guest-input').value);
      const canvas = document.getElementById('qr-canvas');
      const link = document.createElement('a');
      link.download = 'invitation-qr-' + name.replace(/\s+/g, '-').toLowerCase() + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    async function downloadBatch() {
      const raw = document.getElementById('batch-input').value;
      const names = raw.split('\n').map(sanitizeGuestName).filter(Boolean);
      if (names.length === 0) { document.getElementById('batch-input').focus(); return; }

      const btn = document.querySelector('.btn-batch');
      btn.textContent = 'Generating…';
      btn.disabled = true;

      try {
        const zip = new JSZip();
        const offscreen = document.createElement('canvas');
        for (const name of names) {
          await renderQRToCanvas(offscreen, buildUrl(name));
          const blob = await new Promise(res => offscreen.toBlob(res, 'image/png'));
          zip.file('invitation-qr-' + name.replace(/\s+/g, '-').toLowerCase() + '.png', blob);
        }
        const content = await zip.generateAsync({ type: 'blob' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        link.download = 'ta-wedding-qr-codes.zip';
        link.click();
      } finally {
        btn.textContent = 'Download all as ZIP';
        btn.disabled = false;
      }
    }

    document.getElementById('guest-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') generateQR();
    });

    if (presetName) {
      document.getElementById('guest-input').value = presetName;
      generateQR();
    }
  </script>
</body>
</html>
