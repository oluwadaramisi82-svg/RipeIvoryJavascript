<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1a5c42" />
<title>Ahmad &amp; Toyibat — Nikah Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
/* ── tokens ── */
:root {
  --em:   #1a5c42;
  --em2:  #246650;
  --em3:  #0e3d2a;
  --gold: #c9a84c;
  --gl:   #e8d49a;
  --gp:   #f8f0dc;
  --iv:   #fdf8f0;
  --iv2:  #f5edd8;
  --ink:  #1a1a18;
  --mu:   #6a6a60;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: #e8ddc8;
  background-image: radial-gradient(ellipse at 30% 30%, #d9cdb0, #e8ddc8 60%);
  min-height: 100dvh;
  font-family: 'DM Sans', sans-serif;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 16px;
  color: var(--ink);
}
a { color: inherit; text-decoration: none; }
.serif { font-family: 'Cormorant Garamond', Georgia, serif; }

/* ── sender bar ── */
#sender-bar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  background: var(--em3); color: var(--gl);
  padding: 10px 16px; border-radius: 6px;
  margin-bottom: 14px; width: 100%; max-width: 880px;
}
#sender-bar.hidden { display: none; }
.s-label { font-size: 10px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; white-space: nowrap; flex-shrink: 0; }
.s-input {
  flex: 1; min-width: 120px;
  background: rgba(255,255,255,.1); border: 1px solid rgba(201,168,76,.4);
  border-radius: 4px; color: #fff; font-size: 13px; padding: 6px 12px;
  outline: none; font-family: 'DM Sans', sans-serif;
}
.s-input::placeholder { color: rgba(255,255,255,.35); }
.s-input:focus { border-color: var(--gold); }
.s-btn {
  background: var(--gold); color: var(--em3);
  border: none; border-radius: 4px; font-size: 12px; font-weight: 700;
  letter-spacing: .06em; padding: 7px 14px; cursor: pointer;
  white-space: nowrap; flex-shrink: 0; transition: opacity .2s;
  font-family: 'DM Sans', sans-serif;
}
.s-btn:disabled { opacity: .38; cursor: default; }

/* ── scene ── */
#scene { display: flex; flex-direction: column; align-items: center; gap: 18px; width: 100%; max-width: 880px; }

/* ── desktop book ── */
#book {
  display: flex; width: 100%; aspect-ratio: 1.52;
  box-shadow: 0 28px 70px rgba(0,0,0,.30), 0 8px 20px rgba(0,0,0,.16), 0 2px 6px rgba(0,0,0,.10);
  border-radius: 3px 6px 6px 3px;
  perspective: 2400px;
}
.bk-half { flex: 1; position: relative; overflow: hidden; }
#left  { border-radius: 3px 0 0 3px; }
#right { border-radius: 0 6px 6px 0; transform-origin: left center; transform-style: preserve-3d; will-change: transform; }
.spine {
  width: 12px; flex-shrink: 0; z-index: 2;
  background: linear-gradient(to right,#8a7455 0%,#d4bc90 35%,#f0e2c0 50%,#d4bc90 65%,#8a7455 100%);
  position: relative;
}
.spine::after {
  content: '';
  position: absolute; inset: 0;
  background: repeating-linear-gradient(to bottom, transparent 0, transparent 18px, rgba(0,0,0,.06) 18px, rgba(0,0,0,.06) 19px);
}
.pg-num {
  position: absolute; bottom: 11px;
  font-size: 9px; font-weight: 600; letter-spacing: .16em;
  text-transform: uppercase; opacity: .5; color: var(--gold);
  pointer-events: none;
}
#pn-l { left: 14px; }
#pn-r { right: 14px; }

/* ── desktop flip keyframes ── */
@keyframes fwd-out  { from{transform:perspective(2400px) rotateY(0)}     to{transform:perspective(2400px) rotateY(-90deg)} }
@keyframes fwd-in   { from{transform:perspective(2400px) rotateY(90deg)} to{transform:perspective(2400px) rotateY(0)} }
@keyframes back-out { from{transform:perspective(2400px) rotateY(0)}     to{transform:perspective(2400px) rotateY(90deg)} }
@keyframes back-in  { from{transform:perspective(2400px) rotateY(-90deg)} to{transform:perspective(2400px) rotateY(0)} }

/* ── mobile ── */
#phone { display: none; width: 100%; max-width: 420px; aspect-ratio: 0.62; border-radius: 18px; overflow: hidden; position: relative; box-shadow: 0 24px 64px rgba(0,0,0,.28), 0 6px 18px rgba(0,0,0,.16); }
#phone-pg { width: 100%; height: 100%; position: absolute; inset: 0; }
.tap { position: absolute; top: 0; bottom: 0; width: 30%; z-index: 10; background: transparent; border: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
#tap-l { left: 0; }
#tap-r { right: 0; }
.ph-pgnum { position: absolute; bottom: 12px; left: 0; right: 0; text-align: center; font-size: 10px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); opacity: .7; pointer-events: none; z-index: 5; }
@keyframes slide-enter  { from{opacity:0;transform:translateX(32px)}  to{opacity:1;transform:translateX(0)} }
@keyframes slide-exit-l { from{opacity:1;transform:translateX(0)}     to{opacity:0;transform:translateX(-32px)} }
@keyframes slide-exit-r { from{opacity:1;transform:translateX(0)}     to{opacity:0;transform:translateX(32px)} }

/* ── nav ── */
#nav { display: flex; align-items: center; gap: 16px; }
#nav.mobile {
  width: 100%; max-width: 420px;
  background: rgba(14,61,42,.88);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-radius: 999px; padding: 10px 20px; justify-content: center;
}
.arr {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--em); color: var(--gold);
  border: none; font-size: 26px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: background .18s, opacity .18s;
  padding-bottom: 2px; font-family: serif; flex-shrink: 0;
}
#nav.mobile .arr { width: 44px; height: 44px; font-size: 28px; background: transparent; }
#nav.mobile .arr:hover:not(:disabled) { background: rgba(255,255,255,.08); }
.arr:hover:not(:disabled) { background: var(--em3); }
.arr:disabled { opacity: .28; cursor: default; }
#dots { display: flex; gap: 7px; align-items: center; }
.dot {
  width: 8px; height: 8px; border-radius: 50%;
  border: 1.5px solid var(--gold); background: transparent;
  cursor: pointer; border: none; padding: 0;
  border: 1.5px solid var(--gold);
  transition: background .18s, transform .18s;
}
#nav.mobile .dot { border-color: rgba(201,168,76,.55); }
.dot.on { background: var(--gold); transform: scale(1.25); }
#spread-label { font-size: 10px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--em); opacity: .6; }

/* ── page base ── */
.pg {
  height: 100%; display: flex; flex-direction: column;
  justify-content: center;
  padding: clamp(18px,4.5%,44px) clamp(16px,4%,40px);
  overflow: hidden;
}
.pg-em  { background: var(--em); background-image: radial-gradient(ellipse at 70% 20%, var(--em2), var(--em) 60%); color: var(--iv); }
.pg-iv  { background: var(--iv); background-image: linear-gradient(135deg,#fdf8f0,#f8f0e2); color: var(--ink); }
.pg-gd  { background: var(--gp); background-image: radial-gradient(ellipse at 50% 80%,#f0e0b0,var(--gp) 70%); color: var(--ink); }
.pg-ctr { align-items: center; text-align: center; }
.pg-photo { height: 100%; overflow: hidden; position: relative; background: var(--iv2); display: flex; flex-direction: column; }
.pg-photo img { flex: 1; width: 100%; object-fit: cover; object-position: center top; display: block; min-height: 0; }
.photo-footer { padding: 4px 16px 14px; background: #fff; }
.photo-caption { font-size: clamp(10px,1.5vw,14px); font-style: italic; color: var(--mu); text-align: center; }

/* ── atoms ── */
.kicker { font-size: clamp(7px,1.1vw,10px); font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
.kicker.dk { color: var(--mu); }
.section-title { font-size: clamp(24px,4.2vw,50px); font-weight: 500; letter-spacing: -.04em; line-height: .9; color: var(--em); margin-top: 6px; }
.rule { display: flex; align-items: center; gap: 8px; }
.rule-line { flex: 1; height: 1px; background: currentColor; opacity: .35; }
.rule-diamond { display: block; width: 7px; height: 7px; background: currentColor; transform: rotate(45deg); flex-shrink: 0; }
svg.star { display: inline-block; }

/* cover */
.cover-frame { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; width: 100%; }
.cover-bismillah { font-size: clamp(10px,1.5vw,14px); font-style: italic; color: rgba(253,248,240,.7); line-height: 1.7; margin-top: 10px; }
.cover-names { font-size: clamp(40px,7.5vw,90px); font-weight: 500; color: #fff; line-height: .88; letter-spacing: -.045em; margin: 4px 0; }
.cover-amp { display: block; font-size: clamp(22px,4vw,48px); color: var(--gold); font-style: italic; line-height: 1.2; }
.cover-date { font-size: clamp(12px,2vw,22px); color: var(--gold); font-style: italic; }
.cover-place { font-size: clamp(7px,1.1vw,10px); letter-spacing: .22em; text-transform: uppercase; color: rgba(253,248,240,.5); margin-top: 4px; }

/* guest */
.guest-name { font-size: clamp(20px,4vw,48px); font-weight: 500; color: var(--gold); line-height: 1.1; letter-spacing: -.03em; margin: 10px 0 4px; overflow-wrap: break-word; }
.guest-sub  { font-size: clamp(10px,1.4vw,13px); line-height: 1.7; max-width: 90%; color: rgba(253,248,240,.62); }
.guest-couple { font-size: clamp(14px,2.6vw,26px); color: #fff; margin-top: 6px; font-style: italic; }

/* families */
.family-card { background: rgba(26,92,66,.05); border-left: 3px solid var(--gold); padding: clamp(8px,1.5%,14px) clamp(10px,2%,18px); }
.family-name { font-size: clamp(12px,2.2vw,24px); color: var(--em); font-weight: 500; line-height: 1.25; }
.family-and-row { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
.family-line { flex: 1; height: 1px; background: var(--gold); opacity: .35; }
.family-and { font-size: clamp(8px,1.2vw,11px); font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }

/* invite */
.invite-guest { font-size: clamp(18px,3.5vw,42px); font-weight: 500; color: var(--em); line-height: 1.1; letter-spacing: -.025em; margin: 8px 0; overflow-wrap: break-word; }
.invite-sub { font-size: clamp(9px,1.4vw,13px); color: var(--mu); line-height: 1.6; font-style: italic; }
.invite-couple { font-size: clamp(20px,4vw,48px); font-weight: 500; color: var(--em); line-height: 1; letter-spacing: -.04em; }
.invite-amp { display: block; font-size: .55em; color: var(--gold); font-style: italic; line-height: 1.4; }
.footnote-i { font-size: clamp(8px,1.2vw,11px); color: var(--mu); font-style: italic; line-height: 1.6; }

/* detail */
.detail-item { display: flex; flex-direction: column; gap: 3px; padding: 10px 0; border-bottom: 1px solid rgba(201,168,76,.22); }
.detail-item:last-child { border-bottom: none; }
.detail-lbl { font-size: clamp(7px,1vw,9px); font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
.detail-val { font-size: clamp(13px,2.3vw,27px); line-height: 1.25; color: #fff; }

/* directions */
.dir-flow { margin: 10px 0; }
.dir-step { display: flex; align-items: flex-start; gap: 12px; }
.dir-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--gold); flex-shrink: 0; margin-top: 5px; }
.dir-dot.dest { background: var(--em); width: 12px; height: 12px; margin-top: 4px; }
.dir-line-v { width: 1px; height: 26px; background: var(--gold); opacity: .4; margin-left: 4px; }
.dir-text { font-size: clamp(13px,2.2vw,23px); color: var(--ink); }
.dir-sub  { font-size: clamp(8px,1.2vw,11px); color: var(--mu); line-height: 1.6; margin-top: 3px; }

/* countdown */
.cd-grid { display: flex; gap: clamp(8px,2vw,20px); justify-content: center; flex-wrap: wrap; }
.cd-cell { display: flex; flex-direction: column; align-items: center; }
.cd-num  { font-size: clamp(28px,5.5vw,60px); line-height: 1; color: var(--em); font-weight: 500; }
.cd-lbl  { font-size: clamp(6px,.9vw,8px); font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--mu); margin-top: 4px; }

/* toast */
.toast { font-size: clamp(13px,2.3vw,26px); font-style: italic; line-height: 1.75; color: #fff; text-align: center; }
.toast p { margin: 0; }
.toast-s2 { opacity: .82; }
.toast-divider { font-size: clamp(14px,1.8vw,18px); color: var(--gold); opacity: .65; margin: clamp(8px,1.4vw,14px) 0; letter-spacing: .4em; }
.toast-finale { font-size: clamp(14px,2.4vw,28px); font-style: italic; font-weight: 500; color: var(--gold); text-align: center; letter-spacing: -.01em; margin-bottom: 4px; }
.toast-cite { font-size: clamp(8px,1vw,10px); font-style: normal; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: rgba(201,168,76,.7); text-align: center; }

/* verse */
.verse     { font-size: clamp(11px,1.7vw,17px); font-style: italic; line-height: 1.75; color: var(--ink); text-align: center; max-width: 90%; margin: 0 auto; }
.verse-ref { font-size: clamp(8px,1.1vw,10px); font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--em); text-align: center; margin-top: 8px; }
.dua       { font-size: clamp(9px,1.4vw,13px); font-style: italic; color: var(--mu); text-align: center; line-height: 1.6; margin-top: 4px; }

/* rsvp */
.rsvp-list { display: flex; flex-direction: column; gap: 8px; }
.rsvp-row  { display: flex; justify-content: space-between; align-items: center; padding: clamp(9px,1.4%,13px) clamp(11px,2%,18px); border: 1.5px solid var(--em); border-radius: 3px; font-size: clamp(10px,1.4vw,13px); transition: background .18s, color .18s; cursor: pointer; }
.rsvp-row:hover { background: var(--em); color: #fff; }
.rsvp-name { font-weight: 600; color: var(--em); transition: color .18s; }
.rsvp-row:hover .rsvp-name { color: var(--gold); }
.rsvp-phone { color: var(--mu); font-variant-numeric: tabular-nums; font-size: clamp(9px,1.2vw,11px); }
.rsvp-row:hover .rsvp-phone { color: rgba(255,255,255,.75); }

/* dress */
.dress-row    { display: flex; align-items: center; gap: 16px; }
.dress-swatch { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 0 3px rgba(255,255,255,.18); }
.dress-side   { font-size: clamp(7px,1.1vw,10px); font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--gl); }
.dress-colour { font-size: clamp(15px,2.5vw,28px); font-weight: 500; color: #fff; letter-spacing: -.02em; margin-top: 2px; }
.dress-close  { font-size: clamp(10px,1.6vw,15px); font-style: italic; color: rgba(253,248,240,.7); text-align: center; line-height: 1.6; margin-top: 4px; }

/* ── mobile overrides ── */
@media (max-width: 639px) {
  body { padding: 0; background: var(--em3); justify-content: flex-start; }
  #sender-bar { border-radius: 0; margin-bottom: 0; }
  #scene { gap: 0; max-width: 100%; min-height: 100dvh; justify-content: flex-start; }
  #book  { display: none !important; }
  #phone { display: flex !important; flex-direction: column; max-width: 100%; width: 100%; border-radius: 0; aspect-ratio: unset; flex: 1; }
  #phone-pg { border-radius: 0; position: relative; flex: 1; }
  #nav   { max-width: 100%; border-radius: 0; padding: 12px 20px 20px; }
  #spread-label { display: none; }

  .cover-names   { font-size: clamp(56px,17vw,90px); }
  .cover-date    { font-size: clamp(16px,4.5vw,24px); }
  .cover-bismillah { font-size: clamp(12px,3.2vw,16px); }
  .cover-place   { font-size: clamp(9px,2.2vw,12px); }
  .guest-name    { font-size: clamp(28px,8vw,50px); }
  .section-title { font-size: clamp(32px,9vw,52px); }
  .family-name   { font-size: clamp(16px,4.5vw,24px); }
  .invite-guest  { font-size: clamp(22px,7vw,38px); }
  .invite-couple { font-size: clamp(26px,8vw,42px); }
  .detail-val    { font-size: clamp(18px,5vw,28px); }
  .dir-text      { font-size: clamp(18px,5vw,24px); }
  .dir-sub       { font-size: clamp(11px,3vw,14px); }
  .cd-num        { font-size: clamp(36px,10vw,60px); }
  .toast         { font-size: clamp(20px,5.5vw,32px); }
  .verse         { font-size: clamp(14px,4vw,20px); }
  .rsvp-row      { padding: 14px 18px; }
  .rsvp-name     { font-size: 15px; }
  .rsvp-phone    { font-size: 14px; }
  .dress-colour  { font-size: clamp(18px,5vw,28px); }
  .kicker        { font-size: clamp(9px,2.2vw,11px); }
  .pg            { padding: clamp(28px,6%,56px) clamp(24px,6%,48px); }
}
</style>
</head>
<body>

<!-- sender bar -->
<div id="sender-bar">
  <span class="s-label">Personalise this invitation</span>
  <input class="s-input" id="s-input" type="text" placeholder="Guest name…" />
  <button class="s-btn" id="s-btn" disabled>Copy link</button>
</div>

<div id="scene">
  <!-- desktop book -->
  <div id="book">
    <div class="bk-half" id="left"></div>
    <div class="spine"></div>
    <div class="bk-half" id="right"></div>
    <span class="pg-num" id="pn-l"></span>
    <span class="pg-num" id="pn-r" style="right:14px;left:auto"></span>
  </div>

  <!-- mobile -->
  <div id="phone">
    <button class="tap" id="tap-l" aria-label="Previous"></button>
    <button class="tap" id="tap-r" aria-label="Next"></button>
    <div id="phone-pg"></div>
    <span class="ph-pgnum" id="ph-pgnum"></span>
  </div>

  <!-- nav -->
  <nav id="nav" aria-label="Page navigation">
    <button class="arr" id="prev-btn" aria-label="Previous">‹</button>
    <div id="dots"></div>
    <button class="arr" id="next-btn" aria-label="Next">›</button>
  </nav>
  <p id="spread-label"></p>
</div>

<script>
/* ── state ── */
const TOTAL = 6;
const LABELS = ['Cover','Families','Invitation','Directions','Verse','RSVP'];
let spread = 0, half = 0, flipping = false;
let isMobile = window.innerWidth < 640;
let touchStartX = 0;

/* ── guest name ── */
const params = new URLSearchParams(window.location.search);
const rawGuest = (params.get('to') || '').replace(/\+/g,' ').trim();
const guestName = decodeURIComponent(rawGuest);
const displayGuest = guestName || 'Distinguished Guest';
const isPersonalised = Boolean(guestName);

/* ── sender bar ── */
const senderBar = document.getElementById('sender-bar');
const sInput    = document.getElementById('s-input');
const sBtn      = document.getElementById('s-btn');
if (isPersonalised) { senderBar.classList.add('hidden'); }
sInput.addEventListener('input', () => { sBtn.disabled = !sInput.value.trim(); });
sInput.addEventListener('keydown', e => { if (e.key === 'Enter') copyLink(); });
sBtn.addEventListener('click', copyLink);
function copyLink() {
  const enc = encodeURIComponent(sInput.value.trim()).replace(/%20/g,'+');
  const url = `${location.origin}${location.pathname}?to=${enc}`;
  navigator.clipboard.writeText(url).then(() => {
    sBtn.textContent = '✓ Copied!';
    setTimeout(() => { sBtn.textContent = 'Copy link'; }, 2500);
  });
}

/* ── countdown ── */
function getCountdown() {
  const rem = new Date('2026-11-21T11:00:00').getTime() - Date.now();
  if (rem <= 0) return null;
  return {
    days:    Math.floor(rem / 86400000),
    hours:   Math.floor((rem % 86400000) / 3600000),
    minutes: Math.floor((rem % 3600000)  / 60000),
    seconds: Math.floor((rem % 60000)    / 1000),
  };
}
function pad(n) { return String(n).padStart(2,'0'); }
function updateCountdownDOM() {
  const cd = getCountdown();
  document.querySelectorAll('.cd-num').forEach((el,i) => {
    const vals = cd ? [cd.days, cd.hours, cd.minutes, cd.seconds] : [0,0,0,0];
    el.textContent = pad(vals[i] ?? 0);
  });
}
setInterval(updateCountdownDOM, 1000);

/* ── decorative helpers ── */
function rule(color='var(--gold)', my=20) {
  return `<div class="rule" style="margin:${my}px 0;color:${color}"><div class="rule-line"></div><div class="rule-diamond"></div><div class="rule-line"></div></div>`;
}
function stars(color='var(--gold)', gap=10) {
  return `<div style="display:flex;align-items:center;gap:${gap}px;justify-content:center">
    <div style="width:6px;height:6px;background:${color};transform:rotate(45deg)"></div>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="${color}"><polygon points="12,1 14.5,9 23,9 16,14 18.5,22 12,17 5.5,22 8,14 1,9 9.5,9"/></svg>
    <div style="width:6px;height:6px;background:${color};transform:rotate(45deg)"></div>
  </div>`;
}
function moon(size=24, color='var(--gold)') {

/* ── DOM refs ── */
const leftEl  = document.getElementById('left');
const rightEl = document.getElementById('right');
const phonePg = document.getElementById('phone-pg');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const dotsEl  = document.getElementById('dots');
const labelEl = document.getElementById('spread-label');
const phPgNum = document.getElementById('ph-pgnum');
const tapL    = document.getElementById('tap-l');
const tapR    = document.getElementById('tap-r');

/* ── build dots ── */
for (let i = 0; i < TOTAL; i++) {
  const d = document.createElement('button');
  d.className = 'dot' + (i === 0 ? ' on' : '');
  d.setAttribute('aria-label', LABELS[i]);
  d.addEventListener('click', () => { if (!flipping) isMobile ? mobileJumpTo(i) : desktopFlipTo(i); });
  dotsEl.appendChild(d);
}

/* ── render ── */
function renderDesktop() {
  leftEl.innerHTML  = pages[spread * 2];
  rightEl.innerHTML = pages[spread * 2 + 1];
  document.getElementById('pn-l').textContent = spread * 2 + 1;
  document.getElementById('pn-r').textContent = spread * 2 + 2;
  labelEl.textContent = `${LABELS[spread]} · ${spread+1} / ${TOTAL}`;
  updateCountdownDOM();
}
function renderMobile() {
  const idx = spread * 2 + half;
  phonePg.innerHTML = pages[idx];
  phPgNum.textContent = `${idx+1} / ${pages.length}`;
  updateCountdownDOM();
}
function updateDots() {
  dotsEl.querySelectorAll('.dot').forEach((d,i) => d.classList.toggle('on', i === spread));
}
function updateButtons() {
  const mIdx = spread * 2 + half;
  prevBtn.disabled = isMobile ? mIdx <= 0 : spread <= 0;
  nextBtn.disabled = isMobile ? mIdx >= pages.length - 1 : spread >= TOTAL - 1;
}
function applyMode() {
  const book  = document.getElementById('book');
  const phone = document.getElementById('phone');
  const nav   = document.getElementById('nav');
  if (isMobile) {
    book.style.display  = 'none';
    phone.style.display = 'flex';
    nav.classList.add('mobile');
    renderMobile();
  } else {
    book.style.display  = 'flex';
    phone.style.display = 'none';
    nav.classList.remove('mobile');
    renderDesktop();
  }
  updateDots();
  updateButtons();
}

/* ── desktop flip ── */
function desktopFlipTo(next) {
  if (flipping || next < 0 || next >= TOTAL) return;
  flipping = true;
  const fwd = next > spread;
  rightEl.style.animation = `${fwd ? 'fwd-out' : 'back-out'} 0.42s cubic-bezier(.4,0,.6,1) forwards`;
  setTimeout(() => {
    spread = next; half = 0;
    renderDesktop(); updateDots(); updateButtons();
    rightEl.style.animation = 'none';
    rightEl.offsetHeight;
    rightEl.style.animation = `${fwd ? 'fwd-in' : 'back-in'} 0.42s cubic-bezier(.4,0,1,1) forwards`;
    setTimeout(() => { rightEl.style.animation = ''; flipping = false; }, 420);
  }, 420);
}

/* ── mobile navigate ── */
function mobileTo(dir) {
  if (flipping) return;
  const mIdx = spread * 2 + half;
  if (dir === 'next' && mIdx >= pages.length - 1) return;
  if (dir === 'prev' && mIdx <= 0) return;
  flipping = true;
  phonePg.style.animation = dir === 'next' ? 'slide-exit-l .28s ease both' : 'slide-exit-r .28s ease both';
  setTimeout(() => {
    if (dir === 'next') { if (half === 0) half = 1; else { spread++; half = 0; } }
    else                { if (half === 1) half = 0; else { spread--; half = 1; } }
    renderMobile(); updateDots(); updateButtons();
    phonePg.style.animation = 'slide-enter .32s cubic-bezier(.25,.8,.5,1) both';
    setTimeout(() => { phonePg.style.animation = ''; flipping = false; }, 320);
  }, 280);
}
function mobileJumpTo(s) {
  spread = s; half = 0;
  renderMobile(); updateDots(); updateButtons();
}

/* ── nav buttons ── */
prevBtn.addEventListener('click', () => { if (isMobile) mobileTo('prev'); else desktopFlipTo(spread - 1); });
nextBtn.addEventListener('click', () => { if (isMobile) mobileTo('next'); else desktopFlipTo(spread + 1); });
tapL.addEventListener('click', () => mobileTo('prev'));
tapR.addEventListener('click', () => mobileTo('next'));

/* ── swipe ── */
document.getElementById('phone').addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
document.getElementById('phone').addEventListener('touchend',   e => {
  const delta = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(delta) < 44) return;
  mobileTo(delta < 0 ? 'next' : 'prev');
}, { passive: true });

/* ── keyboard ── */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') isMobile ? mobileTo('next') : desktopFlipTo(spread + 1);
  if (e.key === 'ArrowLeft')  isMobile ? mobileTo('prev') : desktopFlipTo(spread - 1);
});

/* ── resize ── */
window.addEventListener('resize', () => {
  const was = isMobile;
  isMobile = window.innerWidth < 640;
  if (isMobile !== was) { half = 0; applyMode(); }
}, { passive: true });

/* ── init ── */
applyMode();
</script>
